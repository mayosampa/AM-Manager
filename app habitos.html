<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Pro — Panel e Historial Completo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
        }
        .habit-check {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .habit-check:active {
            transform: scale(0.85);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 selection:bg-emerald-500 selection:text-slate-950">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- CABECERA PRINCIPAL -->
        <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-slate-900/90 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <div class="flex items-center gap-2 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-1">
                    <i data-lucide="calendar-check-2" class="w-4 h-4"></i>
                    <span id="live-date-banner">Cargando fecha...</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">Panel de Hábitos y Rendimiento</h1>
                <p class="text-slate-400 text-sm mt-1">Historial continuo desde el día 1, rachas acumuladas y balance semanal.</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2.5">
                <button onclick="clearAllHistory()" title="Borra las marcas de ejemplo para empezar de cero hoy" class="px-3.5 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-300 text-xs font-medium flex items-center gap-1.5 transition">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                    Empezar de Cero
                </button>
                <button onclick="exportData()" title="Descargar copia de seguridad (.json)" class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium
