<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Escudo/cuadrado redondeado claro con borde fino sólido -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="12" />

  <!-- Líneas tácticas sutiles de fondo -->
  <circle cx="256" cy="256" r="158" stroke="#E2E8F0" stroke-width="8" stroke-dasharray="18 14" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#E2E8F0" stroke-width="6" />

  <!-- Monograma táctico AM centrado con margen interior limpio -->
  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <!-- Letra A en negro carbón (#0F172A) -->
    <path
      d="M38 365 L138 146 H188 L242 252 L205 274 L163 190 L86 365 H38 Z"
      fill="#0F172A"
    />
    <path
      d="M221 304 L258 282 L302 365 H252 L221 304 Z"
      fill="#0F172A"
    />

    <!-- Letra M en verde esmeralda deportivo (#059669) -->
    <path
      d="M225 146 H273 L296 182 L250 193 L274 216 L246 240 L225 198 V146 Z"
      fill="#059669"
    />
    <path
      d="M293 259 L307 248 L330 270 L335 244 L350 268 L428 146 H474 V365 H429 V220 L362 325 H338 L293 259 Z"
      fill="#059669"
    />

    <!-- Flecha táctica curva (o ---> ) -->
    <circle cx="151" cy="310" r="16" stroke="#059669" stroke-width="11" fill="#FFFFFF" />
    <path
      d="M166 306 C206 296 254 270 293 226"
      stroke="#059669"
      stroke-width="18"
      stroke-linecap="round"
    />
    <path
      d="M270 198 L338 183 L325 251 L270 198 Z"
      fill="#059669"
    />

    <!-- 3 Cruces tácticas (X) -->
    <path d="M150 242 L178 270 M178 242 L150 270" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M186 333 L214 361 M214 333 L186 361" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M350 150 L378 178 M378 150 L350 178" stroke="#059669" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
